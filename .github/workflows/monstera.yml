# G1 specification engine: validate the canonical spec, prove generation is reproducible,
# then compile both generated native projects with the existing Device Lab adapters.
name: monstera

on:
  # push only for main: on a PR branch the pull_request run covers the same commit, and running both doubled
  # every job (including the macOS one).
  push:
    branches: [main]
    paths: ["spec/**", "tools/monstera/**", "tools/monstera-mcp/**", "generated/**", "apps/**", "device-lab/**", ".kiro/**", ".github/workflows/**", "!.github/workflows/studio-ci.yml", "!.kiro/specs/g4-studio/**"]
  pull_request:
    paths: ["spec/**", "tools/monstera/**", "tools/monstera-mcp/**", "generated/**", "apps/**", "device-lab/**", ".kiro/**", ".github/workflows/**", "!.github/workflows/studio-ci.yml", "!.kiro/specs/g4-studio/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  SPEC: spec/samples/monstera-sample/monstera.spec.json
  OUT: generated/monstera-sample
  XTOOL_VERSION: "1.24.0"

defaults:
  run:
    shell: bash

jobs:
  spec:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Python version (standard library only, no installs)
        run: python3 --version
      - name: Unit tests
        run: python3 -m unittest discover -s tools/monstera/tests -t tools/monstera -v
      - name: Validate every sample spec
        run: bash tools/monstera/bin/monstera validate --all
      - name: Sample spec is in canonical form
        run: bash tools/monstera/bin/monstera format --check "$SPEC"
      - name: Invalid inputs are rejected with useful errors
        run: |
          for f in spec/fixtures/raw/*.json; do
            if bash tools/monstera/bin/monstera validate "$f"; then echo "expected $f to be invalid"; exit 1; fi
          done
      - name: Architecture rules (native only)
        run: bash tools/monstera/bin/monstera check-architecture
      - name: Committed output equals a fresh generation (reproducibility)
        run: bash tools/monstera/bin/monstera generate "$SPEC" --check
      - name: Committed output matches its own manifest (no hand edits)
        run: bash tools/monstera/bin/monstera verify "$OUT"
      - name: Regenerate twice in a temp dir and compare byte for byte
        run: |
          bash tools/monstera/bin/monstera generate "$SPEC" --out "$RUNNER_TEMP/a"
          bash tools/monstera/bin/monstera generate "$SPEC" --out "$RUNNER_TEMP/b"
          diff -r "$RUNNER_TEMP/a" "$RUNNER_TEMP/b"
          diff -r "$RUNNER_TEMP/a" "$OUT"
          # The manifest hashes every file: equal manifest hashes on Windows and Linux = identical trees.
          echo "fresh manifest sha256 (Linux):"; sha256sum "$RUNNER_TEMP/a/MONSTERA-MANIFEST.json"
      - name: All quality gates (specs, generation, ownership, architecture/CI safety, Kiro config)
        run: bash tools/monstera/bin/monstera gates --skip-tests
      - name: No project-specific branching in production generator and template code (G6-B)
        run: python3 tools/clean-room/clean_room.py branching "$RUNNER_TEMP/branching.json" && cat "$RUNNER_TEMP/branching.json"
      - name: Same canonical spec on both platforms
        run: |
          cmp "$OUT/android/app/src/main/assets/monstera.spec.json" "$OUT/ios/Sources/MonsteraSample/Resources/monstera.spec.json"
          sha256sum "$OUT/android/app/src/main/assets/monstera.spec.json"

  mcp:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: MCP server tests (parity, security, stdio protocol session)
        run: uv run --frozen --project tools/monstera-mcp python -m unittest discover -s tools/monstera-mcp/tests -t tools/monstera-mcp -v

  android-generated:
    needs: spec
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RUN_ID: ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Use preinstalled JDK 21
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      # G6-B: the two official games are regenerated from their committed specs into empty directories inside the
      # checkout (Device Lab adapters resolve DL_APP_DIR against the repository root), verified, and compared with
      # every committed generator-owned file. Only the fresh trees are built below, never apps/<id>/android.
      - name: Clean-room regeneration of both official games (generate, verify, compare)
        run: |
          for app in apps/pumpkin-blaster apps/trick-or-treat-rush; do
            echo "::group::$app"
            bash tools/clean-room/clean-room.sh "$app"
            echo "::endgroup::"
          done
          cat g6-clean-room-reports/*.compare.json
      # One job for all projects: they share the template, so one runner and one Gradle cache.
      - name: Compile generated Android projects (Device Lab build op)
        run: |
          for app in generated/monstera-sample g6-clean-room/pumpkin-blaster g6-clean-room/trick-or-treat-rush generated/lantern-run; do
            echo "::group::$app"
            RUN_ID="$RUN_ID-$(basename "$app")" DL_APP_DIR="$app/android" bash device-lab/android/adapter.sh build
            echo "::endgroup::"
          done
      # The adapter's build op only runs assembleDebug, so the JVM tests run separately on the fresh projects.
      - name: JVM unit tests of the freshly generated Android projects
        run: |
          for id in pumpkin-blaster trick-or-treat-rush; do
            echo "::group::$id"
            (cd "g6-clean-room/$id/android" && ./gradlew testDebugUnitTest --no-daemon)
            python3 tools/clean-room/clean_room.py junit "g6-clean-room/$id/android/app/build/test-results/testDebugUnitTest" "g6-clean-room-reports/$id.android-junit.json"
            echo "::endgroup::"
          done
          cat g6-clean-room-reports/*.android-junit.json
      - name: Upload build result and clean-room reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: g1-android-${{ github.run_id }}
          path: |
            device-lab/reports/runs/**/results.jsonl
            g6-clean-room-reports/
          if-no-files-found: warn
      - name: Remove the fresh generated trees
        if: always()
        run: rm -rf g6-clean-room

  ios-generated:
    needs: spec
    runs-on: macos-26
    timeout-minutes: 60
    env:
      RUN_ID: ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Toolchain versions
        run: xcodebuild -version && swift --version
      # G6-B: only the fresh trees below are built; the committed app trees are proven byte-identical here.
      - name: Clean-room regeneration of both official games (generate, verify, compare)
        run: |
          for app in apps/pumpkin-blaster apps/trick-or-treat-rush; do
            echo "::group::$app"
            bash tools/clean-room/clean-room.sh "$app"
            echo "::endgroup::"
          done
          cat g6-clean-room-reports/*.compare.json
      - name: Install xtool ${{ env.XTOOL_VERSION }}
        timeout-minutes: 5
        run: |
          curl -fsSL "https://github.com/xtool-org/xtool/releases/download/${XTOOL_VERSION}/xtool.app.zip" -o "$RUNNER_TEMP/xtool.zip"
          ditto -x -k "$RUNNER_TEMP/xtool.zip" "$RUNNER_TEMP"
          echo "XTOOL=$RUNNER_TEMP/xtool.app/Contents/Resources/bin/xtool" >> "$GITHUB_ENV"
      - name: Boot an available iPhone simulator
        run: |
          UDID="$(xcrun simctl list devices available | grep -m1 -E '^[[:space:]]+iPhone' | grep -oE '[0-9A-F-]{36}')"
          test -n "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "SIM_DEVICE=$UDID" >> "$GITHUB_ENV"
      # Sequential in one job (macOS minutes are the scarce resource). Per project: compile the app with its
      # local ios/Runtime and ios/Presentation packages, run the Swift conformance and presentation tests, install, launch, screenshot, logs.
      # simctl cannot inject touches, so lane input and restart are compiled here, not exercised.
      - name: Build, test and launch every generated iOS project
        timeout-minutes: 30
        run: |
          A=device-lab/ios/adapter.sh
          BASE_RUN_ID="$RUN_ID"
          # fd 3, not stdin: swift and simctl read stdin and would swallow the remaining lines.
          while read -r -u 3 app product bundle spec; do
            echo "::group::$app"
            export RUN_ID="$BASE_RUN_ID-$(basename "$app")" DL_APP_DIR="$app/ios" DL_APP_PRODUCT="$product" DL_APP_BUNDLE_ID="$bundle"
            bash $A build
            mkdir -p g6-clean-room-reports
            swift test --package-path "$app/ios/Runtime" 2>&1 | tee "g6-clean-room-reports/$(basename "$app").swift-runtime.log"
            swift test --package-path "$app/ios/Presentation" 2>&1 | tee "g6-clean-room-reports/$(basename "$app").swift-presentation.log"
            bash $A install
            bash $A launch
            sleep 5
            # simctl captures the device framebuffer: a landscape game on a portrait device is captured sideways (E1 evidence).
            bash $A screenshot 01-launched
            sleep 1
            bash $A screenshot 02-later
            bash $A logs
            bash $A stop
            bash $A report
            log="device-lab/reports/runs/$RUN_ID/ios-simulator/logs.txt"
            grep -E "bundledMatches=true decodedMatches=true" "$log"
            # The hash the app logged is the hash of the canonical spec file, not only its own bundled copy.
            grep -F "spec sha256=$(shasum -a 256 "$spec" | cut -d' ' -f1) " "$log"
            # The fixed-tick GameLoop ran in the simulator: at least 60 ticks within the 5 s wait.
            grep -E "runtime ticks=[0-9]+ hash=[0-9a-f]{16} seed=" "$log"
            echo "::endgroup::"
          done 3<<'EOF'
          generated/monstera-sample MonsteraSample app.monstera.sample spec/samples/monstera-sample/monstera.spec.json
          g6-clean-room/pumpkin-blaster PumpkinBlaster app.monstera.pumpkinblaster apps/pumpkin-blaster/monstera.spec.json
          g6-clean-room/trick-or-treat-rush TrickOrTreatRush app.monstera.trickortreatrush apps/trick-or-treat-rush/monstera.spec.json
          generated/lantern-run LanternRun app.monstera.lanternrun spec/samples/lantern-run/monstera.spec.json
          EOF
      - name: Upload Device Lab run (evidence only, no .app)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: g1-ios-simulator-${{ github.run_id }}
          path: |
            device-lab/reports/runs/
            !device-lab/reports/runs/**/*.app/
            !device-lab/reports/runs/**/*.app/**
            g6-clean-room-reports/
          if-no-files-found: warn
      - name: Remove the fresh generated trees
        if: always()
        run: rm -rf g6-clean-room
  conformance:
    needs: spec
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Use preinstalled JDK 21
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - name: Golden scenarios equal a fresh oracle run
        run: bash tools/monstera/bin/monstera validate-scenario --all --oracle
      - name: Conformance, monstera-sample (oracle, Kotlin JVM, Swift in container)
        run: bash tools/monstera/bin/monstera conformance generated/monstera-sample --swift-image toolchain --report "$RUNNER_TEMP/conformance-sample.json"
      - name: Conformance, boundary-lab (oracle, Kotlin JVM, Swift in container)
        run: bash tools/monstera/bin/monstera conformance generated/boundary-lab --swift-image toolchain --report "$RUNNER_TEMP/conformance-lab.json"
      - name: Conformance, pumpkin-blaster (oracle, Kotlin JVM, Swift in container)
        run: bash tools/monstera/bin/monstera conformance apps/pumpkin-blaster --swift-image toolchain --report "$RUNNER_TEMP/conformance-pumpkin-blaster.json"
      - name: Conformance, trick-or-treat-rush (oracle, Kotlin JVM, Swift in container)
        run: bash tools/monstera/bin/monstera conformance apps/trick-or-treat-rush --swift-image toolchain --report "$RUNNER_TEMP/conformance-trick-or-treat-rush.json"
      - name: Conformance, lantern-run (oracle, Kotlin JVM, Swift in container)
        run: bash tools/monstera/bin/monstera conformance generated/lantern-run --swift-image toolchain --report "$RUNNER_TEMP/conformance-lantern-run.json"
      - name: Upload conformance reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: g2-conformance-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/conformance-sample.json
            ${{ runner.temp }}/conformance-lab.json
            ${{ runner.temp }}/conformance-pumpkin-blaster.json
            ${{ runner.temp }}/conformance-trick-or-treat-rush.json
            ${{ runner.temp }}/conformance-lantern-run.json
          if-no-files-found: warn