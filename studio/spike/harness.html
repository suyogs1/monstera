<!doctype html>
<meta charset="utf-8">
<title>MONSTERA M0 spike harness</title>
<script type="module">
  const worker = new Worker("/worker.js", { type: "module" });
  let seq = 0;
  const pending = new Map();
  worker.onmessage = (e) => { const p = pending.get(e.data.id); pending.delete(e.data.id); p(e.data); };
  const call = (cmd, args) => new Promise((resolve) => {
    const id = ++seq; pending.set(id, resolve); worker.postMessage({ id, cmd, args });
  });
  const need = async (cmd, args) => {
    const r = await call(cmd, args);
    if (!r.ok) throw new Error(`${cmd}: ${r.error}`);
    return r;
  };

  // Main-thread responsiveness while the worker computes: largest gap between 10 ms timer ticks.
  let last = performance.now(), maxGap = 0, sampling = false;
  setInterval(() => {
    const now = performance.now();
    if (sampling) maxGap = Math.max(maxGap, now - last - 10);
    last = now;
  }, 10);

  window.runSpike = async (projects, validateCases, edits) => {
    const out = { projects: {} };
    out.initTimings = (await need("init")).value;
    out.info = JSON.parse((await need("info")).value);
    out.validate = JSON.parse((await need("validate_cases", [JSON.stringify(validateCases)])).value);
    sampling = true; maxGap = 0;
    for (const p of projects) {
      const plan = await need("plan_project", [p.id]);
      const gold = await need("golden", [p.id]);
      const live = await need("live", [p.id, p.liveScenario]);
      out.projects[p.id] = { plan: JSON.parse(plan.value), planCallMs: plan.ms,
        golden: JSON.parse(gold.value), goldenCallMs: gold.ms, live: JSON.parse(live.value) };
    }
    out.edits = [];
    for (const ed of edits) {
      const r = await need("edited", [ed.project, ed.scenario, JSON.stringify(ed.pointer), JSON.stringify(ed.value)]);
      out.edits.push({ ...ed, result: JSON.parse(r.value) });
    }
    sampling = false;
    out.mainThreadMaxGapMs = maxGap;
    return out;
  };
  window.ready = true;
</script>
